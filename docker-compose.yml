services:
  parser:
    build: .
    ports:
      - "8000:8000"
    environment:
      - SERVICE_SECRET=dev-secret
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - parser-models:/root/.cache
    deploy:
      resources:
        limits:
          memory: 4G

volumes:
  parser-models:
