[project]
name = "ai-reader-parser"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "docling>=2.0",
    "pydantic-settings>=2.0",
    # Ligature recovery reads the text layer and renders/crops word images via pypdfium2 +
    # Pillow + numpy (all Docling dependencies, declared here because we import them directly).
    "pypdfium2>=4",
    "pillow>=10",
    "numpy>=1.24",
    # OCR for recognising broken glyph crops, and the full-page backstop for unrecognised ones.
    "rapidocr>=3",
    "onnxruntime>=1.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
